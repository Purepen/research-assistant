# Default Configuration
# This file contains base settings that can be overridden by dev.yaml or prod.yaml

research:
  web_search:
    enabled: true
    max_queries: 5
    timeout_seconds: 30
  
  auto_discovery:
    enabled: true
    target_projects: 3
    min_required: 1
    max_accepted: 3
    quality_threshold: 0.7
  
  review:
    max_iterations: 3
    auto_approve_threshold: 85
    min_passing_score: 70
  
  features:
    email_notifications: true
    deep_research: true
    parallel_agents: false
    user_dumps_analysis: true
    deduplication: true

llm:
  provider: "anthropic"
  model: "claude-sonnet-4-20250514"
  api_key_env: "ANTHROPIC_API_KEY"
  temperature: 0.7
  max_tokens: 4000

database:
  url: "postgresql://localhost/research_assistant"
  pool_size: 5
  echo: false

storage:
  provider: "local"
  local_path: "./output"
  bucket_name: null

email:
  provider: "resend"
  api_key_env: "RESEND_API_KEY"
  from_email: "Research Assistant <onboarding@resend.dev>"

log_level: "INFO"
log_format: "json"
