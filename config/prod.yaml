# Production Configuration

debug: false
log_level: "INFO"

research:
  web_search:
    enabled: true
    max_queries: 5
  
  auto_discovery:
    enabled: true
    target_projects: 3
    min_required: 2  # Require at least 2 in prod
  
  review:
    max_iterations: 3
  
  features:
    email_notifications: true
    deep_research: true
    parallel_agents: true  # Enable in prod for speed
    user_dumps_analysis: true
    deduplication: true

database:
  echo: false
  pool_size: 10  # Larger pool in prod

storage:
  provider: "s3"  # Use S3 in prod
  bucket_name: "research-assistant-prod"

log_format: "json"
